<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BAAP LUDO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;font-family:Arial,Helvetica,sans-serif;color:#293242}
:root{--purple:#21002f;--purple2:#4c0870;--pink:#f65ca5;--blue:#26a9ff;--light:#f7f8fc;--card:#dce9ff;--ink:#1b0828}
.app{width:100%;max-width:665px;min-height:100vh;margin:auto;background:#fff;position:relative;padding-bottom:78px;overflow:hidden}
.header{height:96px;background:linear-gradient(100deg,#09000e,#300046,#120016);border-bottom:4px solid #ff9ed0;display:flex;align-items:center;gap:18px;padding:12px 20px;position:sticky;top:0;z-index:20}
.menu-btn{font-size:36px;color:#fff;background:none;border:0;width:48px}.logo{width:75px;height:75px;border-radius:50%;display:grid;place-items:center;color:#ffd66c;font-weight:900;font-size:13px;text-align:center;border:2px solid #b78b2f;background:radial-gradient(circle,#503b12,#0c0710 68%);box-shadow:0 0 12px #f8d66b55}
.spacer{flex:1}.pill{display:flex;align-items:center;gap:7px;background:linear-gradient(#61d8ff,#168df0);border:1px solid #6fe6ff;box-shadow:0 0 15px #2bbcffaa;color:#fff;border-radius:30px;padding:12px 15px;font-size:17px;font-weight:bold;white-space:nowrap}
.content{padding:12px 20px}.notice{background:linear-gradient(90deg,#260019,#17000e);color:white;border:1px solid #ffb0d8;border-radius:8px;padding:12px;font-size:14px;line-height:1.45;margin-bottom:18px}.section-title{font-size:20px;font-weight:800;margin:15px 0 14px;text-align:center;background:linear-gradient(90deg,#ff7284,#a74fff,#399aff);color:white;border-radius:7px;padding:14px;box-shadow:0 3px 5px #aaa}
.page{display:none}.page.active{display:block}.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.live-label{color:#ff7d9a;font-size:12px;margin:0 0 15px 6px}.promo{height:190px;border-radius:7px;background:#090909;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:900;color:#ffd94a;border:1px solid #222;padding:10px}.promo.ludo{background:radial-gradient(circle at 50% 40%,#263e89,#03030a 65%);text-shadow:3px 3px #e9007d}.promo.support{background:#000;color:#42e83b;font-size:26px;text-shadow:2px 2px #ff2d5f;cursor:pointer;user-select:none}
.amount{display:flex;gap:10px;margin:12px 0 18px}.amount input{min-width:0;flex:1;padding:15px;border:1px solid #aaa;border-radius:7px;font-size:16px}.btn{border:0;border-radius:28px;padding:13px 24px;font-weight:800;font-size:16px;cursor:pointer}.blue{background:linear-gradient(#69d9ff,#2198f4);color:#fff;box-shadow:0 4px 12px #888}.green{background:#20d85c;color:#fff}.purple{background:#5143e6;color:white}
.battle{background:#e3edff;border:3px solid #6764ec;border-radius:20px;padding:13px 14px;margin:12px 0;display:flex;align-items:center;gap:10px}.battle-info{flex:1;min-width:0}.battle-info .tag{font-size:12px;color:#4c87d0;background:#f4f8ff;border-radius:3px;padding:4px 7px;margin-right:8px}.battle-info strong{font-size:16px}.labels{display:flex;gap:18px;margin-top:10px;font-size:12px}.labels b{display:block;font-size:19px;margin-top:5px}.labels .prize{color:#13b982}.battle .btn{min-width:105px}
.running{background:#d5e5ff;border-radius:8px;padding:12px;margin:12px 0}.playing{text-align:center;font-weight:bold;color:#66758b}.names{background:#fff;border-radius:25px;padding:9px 15px;display:inline-block;color:#333;box-shadow:0 3px 7px #aaa}.running-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.money{background:#100018;color:#fff;border-radius:4px;padding:10px;text-align:center;flex:1;box-shadow:0 0 8px #9e83b8}.money small{display:block;font-size:10px}.money b{display:block;color:#ffd21f;font-size:20px;margin-top:5px}.controller{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 7px #999}
.profile-head{background:linear-gradient(135deg,#061b25,#0d3044);border-radius:0 0 18px 18px;padding:28px;text-align:center;color:white}.avatar{width:85px;height:85px;border-radius:50%;margin:auto;background:#ffad73;border:3px solid white;display:grid;place-items:center;font-size:42px}.profile-head h2{margin:10px 0 0}.profile-box{background:#d7e5ff;border-radius:28px;padding:20px;margin-top:18px}.detail{background:#fff;border-radius:20px;padding:15px;margin:12px 0}.detail small{display:block;color:#75808e}.kyc{background:#e6ffe9;color:#28a36d;padding:15px;border:1px solid #9ce4a4;border-radius:10px;text-align:center}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.stat{background:#063142;color:white;border-radius:9px;text-align:center;padding:22px 8px}.stat b{display:block;font-size:27px;margin-top:12px}
.balance{background:#fff;border-radius:25px;padding:28px;text-align:center;box-shadow:0 2px 12px #ddd}.balance h1{color:#12b889}
.cash-card{background:#d6e5ff;border-radius:25px;padding:25px;margin-top:18px}.cash-card h2{margin:0;color:#64748a}.cash-card .value{font-size:34px;font-weight:bold;margin:10px 0 22px}.cash-card .btn{width:100%}
.refer-hero,.help-hero{background:linear-gradient(120deg,#263bde,#7d35ed);color:#fff;border-radius:30px;padding:30px 28px;margin-bottom:30px}.refer-hero h1,.help-hero h1{font-size:34px;margin:12px 0}.refer-hero p,.help-hero p{font-size:17px;line-height:1.5;color:#e0e4ff}.codebox{padding:20px;border-radius:24px;box-shadow:0 3px 18px #ddd;text-align:center}.code{display:flex;justify-content:space-between;align-items:center;background:#f1f5fb;border:2px dashed #ccd4df;border-radius:17px;padding:15px;font-size:24px;font-weight:bold}.contact{display:flex;align-items:center;gap:18px;padding:25px;border-radius:25px;background:#fff;box-shadow:0 2px 12px #e5e5e5;margin:18px 0}.contact .emoji{font-size:38px}.contact h2{margin:0}.contact p{margin:5px 0;color:#7b8796}
.drawer{position:fixed;left:0;top:0;width:min(408px,88%);height:100vh;background:linear-gradient(#2b0340,#08000e);z-index:50;color:white;transform:translateX(-105%);transition:.25s;padding:16px 11px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-top{height:105px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:4px solid #b65a9f}.drawer-logo{font-size:30px;font-weight:900;color:#fff;text-shadow:2px 2px #ff1f63}.drawer-item{display:flex;align-items:center;justify-content:space-between;background:#6a5a79;border-bottom:7px solid #9b2d86;border-radius:9px;padding:16px 18px;margin:10px 0;font-size:19px;font-weight:bold}.drawer-item button{background:none;border:0;font-size:24px}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:40}.overlay.show{display:block}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(665px,100%);height:78px;background:linear-gradient(90deg,#08000c,#26003d,#08000c);display:flex;justify-content:space-around;align-items:center;z-index:30;border-top:1px solid #9d5fb7}.bottom button{border:0;background:none;color:#fff;font-size:12px;font-weight:bold;padding:7px 13px;border-radius:30px}.bottom button span{display:block;font-size:28px;margin-bottom:3px}.bottom button.active{background:#fff;color:#222}
@media(max-width:390px){.content{padding:10px 12px}.header{padding:10px 12px;gap:8px}.pill{font-size:13px;padding:10px}.live-grid{gap:8px}.promo{height:145px;font-size:22px}.battle{padding:10px}.battle .btn{min-width:80px;padding:11px 10px}.labels{gap:8px}.labels b{font-size:16px}.bottom button{padding:5px 8px}.bottom button span{font-size:24px}}

.login-screen{position:fixed;inset:0;background:linear-gradient(145deg,#120018,#4b0870);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px}.login-card{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:28px;box-shadow:0 15px 45px #0008}.login-card h1{text-align:center;color:#39004d}.login-card input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccd1dc;border-radius:12px;font-size:16px}.login-card .btn{width:100%;margin-top:10px}.switch{display:block;text-align:center;color:#6b3edc;margin-top:16px;background:none;border:0;cursor:pointer}

.qr-modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  display: flex; justify-content: center; align-items: center;
  z-index: 9999; padding: 10px;
}
.qr-modal-content {
  background: #ffffff;
  padding: 25px 20px;
  border-radius: 20px;
  width: 100%; max-width: 350px;
  text-align: center;
  position: relative;
  box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.close-modal-btn {
  position: absolute; right: 15px; top: 5px;
  font-size: 32px; cursor: pointer; color: #888;
}
.close-modal-btn:hover { color: #000; }
.qr-subtext { font-size: 13px; color: #d93838; font-weight: bold; margin: 10px 0 15px; line-height: 1.4; }
.qr-image-wrapper { background: #fff; padding: 10px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.qr-image-wrapper canvas, .qr-image-wrapper img { width: 200px; height: 200px; display: block; }
.upi-id-box { background: #f3f4f6; padding: 10px; border-radius: 10px; margin: 15px 0; border: 1px dashed #cbd5e1; }
.wa-notify-btn {
  display: block; background: #25D366; color: white;
  padding: 13px; border-radius: 10px; text-decoration: none;
  font-weight: bold; font-size: 15px; box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
}
.wa-notify-btn:hover { background: #1ebd55; }
</style>
<script src="https://cloudflare.com"></script>
</head>
<body>

<div class="app">
  <div class="header">
    <button class="menu-btn" onclick="toggleDrawer()">☰</button>
    <div class="logo">BAAP<br>LUDO</div>
